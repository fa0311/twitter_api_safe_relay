name: Publish npm packages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - package: twitter-api-safe-inject
            path: packages/inject
          - package: twitter-api-safe-request
            path: packages/request
          - package: twitter-api-safe-wxt
            path: packages/wxt
          - package: twitter-api-safe-relay
            path: packages/server
          - package: twitter-api-safe-relay-dashboard
            path: packages/dashboard
          - package: twitter-api-safe-mcp
            path: packages/mcp

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Check published version
        id: version
        working-directory: ${{ matrix.path }}
        run: |
          spec="$(jq -r '"\(.name)@\(.version)"' package.json)"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already on npm"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.should_publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish new package version
        if: steps.version.outputs.should_publish == 'true'
        run: pnpm --filter "${{ matrix.package }}" publish --access public --provenance --no-git-checks
