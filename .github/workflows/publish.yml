name: Publish npm packages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - package: twitter-api-safe-inject
            path: packages/inject
          - package: twitter-api-safe-request
            path: packages/request
          - package: twitter-api-safe-wxt
            path: packages/wxt

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check published version
        id: version
        env:
          PACKAGE_DIR: ${{ runner.temp }}/npm-packages
          PACKAGE_NAME: ${{ matrix.package }}
          PACKAGE_PATH: ${{ matrix.path }}
        shell: bash
        run: |
          package_version="$(node -p "require('./${PACKAGE_PATH}/package.json').version")"
          package_spec="${PACKAGE_NAME}@${package_version}"
          echo "tarball=${PACKAGE_DIR}/${PACKAGE_NAME}-${package_version}.tgz" >> "$GITHUB_OUTPUT"

          set +e
          view_output="$(npm view "$package_spec" version --json 2>&1)"
          view_status=$?
          set -e

          if [[ $view_status -eq 0 ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${package_spec}: already published."
            exit 0
          fi

          if grep -qE "E404|404 Not Found" <<<"$view_output"; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "${package_spec} has not been published yet."
            exit 0
          fi

          echo "$view_output" >&2
          exit "$view_status"

      - name: Install dependencies
        if: steps.version.outputs.should_publish == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify package
        if: steps.version.outputs.should_publish == 'true'
        run: pnpm --filter "${{ matrix.package }}" verify

      - name: Pack package
        if: steps.version.outputs.should_publish == 'true'
        env:
          PACKAGE_DIR: ${{ runner.temp }}/npm-packages
        run: |
          mkdir -p "$PACKAGE_DIR"
          pnpm --filter "${{ matrix.package }}" pack --pack-destination "$PACKAGE_DIR"

      - name: Publish new package version
        if: steps.version.outputs.should_publish == 'true'
        env:
          TARBALL: ${{ steps.version.outputs.tarball }}
        run: npm publish "$TARBALL" --access public
