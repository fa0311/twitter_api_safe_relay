name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: relay
            suffix: relay
            version_path: packages/server
          - target: dashboard
            suffix: dashboard
            version_path: packages/dashboard
          - target: relay-slim
            suffix: relay-slim
            version_path: packages/server
          - target: dashboard-slim
            suffix: dashboard-slim
            version_path: packages/dashboard
          - target: relay-firefox
            suffix: relay-firefox
            version_path: packages/server
          - target: dashboard-firefox
            suffix: dashboard-firefox
            version_path: packages/dashboard
          - target: relay-webkit
            suffix: relay-webkit
            version_path: packages/server
          - target: dashboard-webkit
            suffix: dashboard-webkit
            version_path: packages/dashboard
          - target: init-profile
            suffix: init-profile

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (${{ matrix.target }})
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute version
        id: vars
        env:
          VERSION_PATH: ${{ matrix.version_path }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          if [[ -n "$VERSION_PATH" ]]; then
            version="$(node -p "require('./${VERSION_PATH}/package.json').version")"
          else
            version="$(echo "${IMAGE_ID#sha256:}" | cut -c1-12)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check published image
        id: exists
        env:
          TAG: ${{ env.IMAGE }}:${{ steps.vars.outputs.version }}-${{ matrix.suffix }}
        run: |
          if docker manifest inspect "$TAG" >/dev/null 2>&1; then
            echo "should_push=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${TAG}: already published."
          else
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push (${{ matrix.target }})
        if: steps.exists.outputs.should_push == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest-${{ matrix.suffix }}
            ${{ env.IMAGE }}:${{ steps.vars.outputs.version }}-${{ matrix.suffix }}
          cache-from: type=gha
