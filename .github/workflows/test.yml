name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  vitest:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node: [24.x, 25.x, 26.x]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Run dashboard tests
        run: pnpm --filter twitter-api-safe-relay-dashboard test

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter twitter-api-safe-relay exec playwright install --with-deps chromium

      # the Playwright suites need a logged-in X session (fa0311/twitter-secrets); skipped on forks without the key
      - name: Decrypt X session
        if: env.SOPS_AGE_KEY != ''
        uses: fa0311/twitter-secrets@main
        with:
          age-key: ${{ env.SOPS_AGE_KEY }}

      # GitHub-hosted runners get a Cloudflare challenge from x.com; the browser goes through a shared proxy
      # (proxy_list is ordered fastest first, the slow exits made page loads exceed the navigation timeout)
      - name: Pick a proxy
        if: env.SOPS_AGE_KEY != ''
        run: echo "X_PROXY_URL=$(head -n1 <<<"$PROXY_LIST")" >> "$GITHUB_ENV"

      - name: Run request tests
        if: env.SOPS_AGE_KEY != ''
        run: pnpm --filter twitter-api-safe-request test
        env:
          X_COOKIE_FILE: ${{ github.workspace }}/cookie.json

      - name: Run relay tests
        if: env.SOPS_AGE_KEY != ''
        run: pnpm --filter twitter-api-safe-relay test
        env:
          X_COOKIE_FILE: ${{ github.workspace }}/cookie.json
